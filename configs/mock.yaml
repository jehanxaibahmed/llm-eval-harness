# Offline run: simulated models, no API key needed. Used by CI.
name: mock
provider: mock
seed: 0
concurrency: 8
suites:
  - evals/order_extraction
  - evals/invoice_extraction
models:
  - id: mock/precise-large
    label: precise-large
  - id: mock/balanced-medium
    label: balanced-medium
  - id: mock/fast-small
    label: fast-small
regression:
  baseline: baselines/mock.json
  max_accuracy_drop: 0.02
  max_json_valid_drop: 0.05
  max_cost_increase_pct: 25
  min_field_accuracy: 0.5
