# Live run via LiteLLM. Requires native API keys (OPENAI_API_KEY, etc.).
# Model ids: https://openrouter.ai/models. Prices are a fallback for when the
# API response doesn't include cost (USD per million tokens).
name: live
provider: litellm
concurrency: 4
suites:
  - evals/order_extraction
  - evals/invoice_extraction
models:
  - id: anthropic/claude-haiku-4.5
    label: claude-haiku-4.5
    price: { input_per_mtok: 1.0, output_per_mtok: 5.0 }
  - id: openai/gpt-4o-mini
    label: gpt-4o-mini
    price: { input_per_mtok: 0.15, output_per_mtok: 0.6 }
  - id: google/gemini-2.5-flash
    label: gemini-2.5-flash
    price: { input_per_mtok: 0.3, output_per_mtok: 2.5 }
